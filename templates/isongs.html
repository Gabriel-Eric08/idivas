{% extends 'base.html' %}

{% block title %}iSongs{% endblock %}

{% block extra_css %}
<style>
    /* ========================================================= */
    /* --- LAYOUT GRUDADO COM FUNDO CINZA SÓLIDO (ESTILO APP) --- */
    /* ========================================================= */
    
    /* Container Master: Fundo cinza sólido, eliminando o efeito flutuante */
    .isongs-master-wrapper {
        background-color: #181818; /* Cinza escuro sólido clássico */
        color: #ffffff;
        width: 100%;
        min-height: 100vh;
        padding: 40px;
        box-sizing: border-box;
        text-align: left;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* Título ISONGS no topo esquerdo */
    .isongs-header-box {
        margin-bottom: 40px;
        border-bottom: 1px solid #282828;
        padding-bottom: 20px;
    }

    .isongs-main-title {
        font-size: 3rem;
        font-weight: 900;
        letter-spacing: -1px;
        margin: 0;
        color: #fff;
    }

    /* Cabeçalhos de Seção */
    .isongs-section-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        margin-bottom: 16px;
        margin-top: 30px;
    }

    .isongs-section-title {
        font-size: 1.5rem;
        font-weight: 700;
        letter-spacing: -0.5px;
        margin: 0;
        color: #ffffff;
    }

    .isongs-show-all {
        color: #b3b3b3;
        font-size: 0.85rem;
        font-weight: 700;
        text-decoration: none;
    }
    .isongs-show-all:hover {
        text-decoration: underline;
    }

    /* Linhas horizontais de Scroll */
    .isongs-row {
        display: flex;
        gap: 24px;
        overflow-x: auto;
        padding-bottom: 20px;
        width: 100%;
    }

    /* Ocultar barra de rolagem para parecer um app nativo */
    .isongs-row::-webkit-scrollbar {
        display: none;
    }
    .isongs-row {
        -ms-overflow-style: none;
        scrollbar-width: none;
    }

    /* --- ARTISTAS POPULARES (CÍRCULOS) --- */
    .artist-card {
        flex: 0 0 auto;
        width: 160px;
        text-align: left;
        cursor: pointer;
    }

    .artist-circle {
        width: 160px;
        height: 160px;
        border-radius: 50%;
        object-fit: cover;
        margin-bottom: 12px;
        box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }

    .artist-name {
        font-size: 1rem;
        font-weight: 700;
        color: #ffffff;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        margin-bottom: 4px;
    }

    .artist-badge {
        color: #b3b3b3;
        font-size: 0.85rem;
    }

    /* --- SINGLES E ÁLBUNS (QUADRADOS) --- */
    .album-card {
        flex: 0 0 auto;
        width: 160px;
        text-align: left;
        cursor: pointer;
        padding: 12px;
        background: #222222; /* Cinza levemente mais claro para destacar os cards */
        border-radius: 8px;
        transition: background-color 0.3s ease;
    }

    .album-card:hover {
        background-color: #2a2a2a;
    }

    .album-square {
        width: 136px;
        height: 136px;
        border-radius: 6px;
        object-fit: cover;
        margin-bottom: 12px;
        box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }

    .album-title {
        font-size: 1rem;
        font-weight: 700;
        color: #ffffff;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        margin-bottom: 4px;
    }

    .album-artist {
        color: #b3b3b3;
        font-size: 0.85rem;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    /* --- SEÇÃO DE MÚSICAS EXPANDIDA --- */
    .tracks-expansion-panel {
        display: none;
        background: #222222; /* Bloco cinza sólido para as músicas */
        border-radius: 8px;
        padding: 30px;
        margin-top: 40px;
        box-shadow: 0 8px 24px rgba(0,0,0,0.6);
        animation: fadeIn 0.5s ease;
    }

    .panel-content {
        display: flex;
        gap: 32px;
    }

    .panel-cover-side {
        flex: 0 0 auto;
        width: 200px;
    }

    .panel-album-cover {
        width: 200px;
        height: 200px;
        border-radius: 8px;
        box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        object-fit: cover;
    }

    .panel-album-title {
        font-size: 1.8rem;
        font-weight: 700;
        margin-top: 16px;
        margin-bottom: 4px;
    }

    .panel-list-side {
        flex: 1;
    }

    .track-table {
        width: 100%;
        border-collapse: collapse;
    }

    .track-table th {
        color: #b3b3b3;
        font-size: 0.85rem;
        font-weight: 400;
        text-transform: uppercase;
        border-bottom: 1px solid #333333;
        padding-bottom: 12px;
        text-align: left;
    }

    .track-row {
        border-bottom: 1px solid transparent;
        transition: background-color 0.2s ease;
        cursor: pointer;
    }

    .track-row:hover {
        background-color: rgba(255,255,255,0.08);
    }

    .track-row td {
        padding: 12px 16px;
        font-size: 0.95rem;
        color: #ffffff;
    }

    .track-num { width: 40px; color: #b3b3b3; }
    .track-duration { text-align: right; width: 60px; color: #b3b3b3; }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(15px); }
        to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 768px) {
        .panel-content { flex-direction: column; }
        .isongs-master-wrapper { padding: 20px; }
    }
    .isongs-section {
        background: #222222;
        border-radius: 12px;
        padding: 24px;
        margin-bottom: 32px;
    }

    .isongs-row {
        background: #222222;
        border-radius: 12px;
        padding: 16px 0 0 0;
    }

    .album-card {
        background: transparent;
    }

    .album-card:hover {
        background: rgba(255,255,255,0.08);
    }
    .tracks-expansion-panel {
        background: #222222;
        border-radius: 12px;
    }
</style>
{% endblock %}

{% block content %}
    <div class="isongs-master-wrapper">
        
        <div class="isongs-header-box">
            <h1 class="isongs-main-title">ISONGS</h1>
        </div>
        <div class="isongs-section">
            <div class="isongs-section-header">
                <h2 class="isongs-section-title">Artistas populares</h2>
                <a href="#" class="isongs-show-all">Mostrar tudo</a>
            </div>
            <div class="isongs-row" id="artists-container"></div>
        </div>

        <div class="isongs-section">
            <div class="isongs-section-header">
                <h2 class="isongs-section-title">Singles e álbuns que todo mundo gosta</h2>
                <a href="#" class="isongs-show-all">Mostrar tudo</a>
            </div>
            <div class="isongs-row" id="albums-container"></div>
        </div>

        <div class="isongs-section">
            <div class="tracks-expansion-panel" id="tracks-panel">
                <div class="panel-content" id="panel-content-target"></div>
            </div>
        </div>
    </div>

    <script>
    const iSongsData = {
        artists: [
            { name: "Henrique & Juliano", image: "https://images.unsplash.com/photo-1516575334481-f85287c2c82d?w=300" },
            { name: "Diego & Victor Hugo", image: "https://images.unsplash.com/photo-1541364983171-a8ba01e95cfc?w=300" },
            { name: "Grupo Menos É Mais", image: "https://images.unsplash.com/photo-1594411139151-5b9b7e754e1a?w=300" },
            { name: "Jorge & Mateus", image: "https://images.unsplash.com/photo-1531259683007-016a7b628fc3?w=300" },
            { name: "Zé Neto & Cristiano", image: "https://images.unsplash.com/photo-1501386761578-eac5c94b800a?w=300" },
            { name: "Matheus & Kauan", image: "https://images.unsplash.com/photo-1506157786151-b8491531f063?w=300" }
        ],
        albums: [
            {
                id: "album_1",
                title: "White Noise (Sleep & Relaxation)",
                artist: "Sleepy John",
                image: "https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=400",
                tracks: [
                    { number: 1, title: "Chuva Suave de Outono", duration: "3:45" },
                    { number: 2, title: "Ondas do Mar Profundo", duration: "4:12" },
                    { number: 3, title: "Vento nas Montanhas", duration: "5:00" }
                ]
            },
            {
                id: "album_2",
                title: "Manifesto Musical 2",
                artist: "Henrique & Juliano",
                image: "https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=400",
                tracks: [
                    { number: 1, title: "Traumatizei", duration: "2:55" },
                    { number: 2, title: "Arranhão", duration: "3:14" },
                    { number: 3, title: "A Maior Saudade", duration: "3:01" }
                ]
            },
            {
                id: "album_3",
                title: "MAYHEM",
                artist: "Lady Gaga",
                image: "https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=400",
                tracks: [
                    { number: 1, title: "Free Woman", duration: "3:11" },
                    { number: 2, title: "Alice", duration: "2:57" },
                    { number: 3, title: "Stupid Love", duration: "3:13" }
                ]
            },
            {
                id: "album_4",
                title: "333",
                artist: "Matuê",
                image: "https://images.unsplash.com/photo-1498038432885-c6f3f1b912ee?w=400",
                tracks: [
                    { number: 1, title: "Filho da Noite", duration: "2:40" },
                    { number: 2, title: "Vampiro", duration: "3:22" }
                ]
            }
        ]
    };

    function renderArtists() {
        const container = document.getElementById('artists-container');
        container.innerHTML = iSongsData.artists.map(artist => `
            <div class="artist-card">
                <img src="${artist.image}" class="artist-circle" alt="${artist.name}">
                <div class="artist-name">${artist.name}</div>
                <div class="artist-badge">Artista</div>
            </div>
        `).join('');
    }

    function renderAlbums() {
        const container = document.getElementById('albums-container');
        container.innerHTML = iSongsData.albums.map(album => `
            <div class="album-card" onclick="expandAlbum('${album.id}')">
                <img src="${album.image}" class="album-square" alt="${album.title}">
                <div class="album-title">${album.title}</div>
                <div class="album-artist">${album.artist}</div>
            </div>
        `).join('');
    }

    function expandAlbum(albumId) {
        const panel = document.getElementById('tracks-panel');
        const target = document.getElementById('panel-content-target');
        const album = iSongsData.albums.find(a => a.id === albumId);
        
        if (!album) return;

        const trackRows = album.tracks.map(track => `
            <tr class="track-row">
                <td class="track-num">${track.number}</td>
                <td>${track.title}</td>
                <td class="track-duration">${track.duration}</td>
            </tr>
        `).join('');

        target.innerHTML = `
            <div class="panel-cover-side">
                <img src="${album.image}" class="panel-album-cover" alt="${album.title}">
                <h3 class="panel-album-title">${album.title}</h3>
                <p style="color: #b3b3b3; margin:0; font-size:0.9rem;">${album.artist}</p>
            </div>
            <div class="panel-list-side">
                <table class="track-table">
                    <thead>
                        <tr>
                            <th class="track-num">#</th>
                            <th>TÍTULO</th>
                            <th class="track-duration"><svg width="16" height="16" viewBox="0 0 16 16" fill="#b3b3b3"><path d="M8 1.5a6.5 6.5 0 100 13 6.5 6.5 0 000-13zM0 8a8 8 0 1116 0A8 8 0 010 8zm9-3v3h3v1.5H7.5V5H9z"/></svg></th>
                        </tr>
                    </thead>
                    <tbody>
                        ${trackRows}
                    </tbody>
                </table>
            </div>
        `;

        panel.style.display = 'block';
        panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    window.onload = () => {
        renderArtists();
        renderAlbums();
    };
    </script>
{% endblock %}
