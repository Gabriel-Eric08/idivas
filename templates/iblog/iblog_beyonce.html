{% extends 'base.html' %}

{% block title %}Top Álbuns - iDiva's Portal{% endblock %}

{% block extra_css %}
<style>
    /* Força o conteúdo a se comportar como uma coluna centralizada */
    .page-content {
        display: flex !important;
        flex-direction: column !important;
        align-items: center !important;
        justify-content: transform !important;
        width: 95% !important;
        max-width: 1300px !important;
        margin: 30px auto 50px auto !important; /* Margem superior para desgrudar da navbar */
    }

    .blog-container {
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    /* Estilos exclusivos das imagens do post */
    .animated-page-img {
        width: 100%;
        max-width: 100%;
        height: auto;
        display: block;
        border-radius: 20px;
        filter: drop-shadow(0 15px 25px rgba(0,0,0,0.5));
        margin-bottom: 25px;
    }

    .transition-divider {
        background: rgba(0, 0, 0, 0.85);
        padding: 40px 20px;
        text-align: center;
        border-top: 2px solid rgba(255, 255, 255, 0.1);
        border-bottom: 2px solid rgba(255, 255, 255, 0.1);
        width: 100%;
        margin-bottom: 25px;
        border-radius: 15px;
    }

    .transition-title {
        font-family: 'VT323', monospace;
        font-size: calc(2rem + 1vw);
        color: #ffffff;
        text-transform: uppercase;
        letter-spacing: 4px;
        line-height: 1;
        margin: 0;
        text-shadow: -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000, 4px 4px 0px rgba(0, 0, 0, 0.5);
    }

    .transition-subtitle {
        font-family: 'VT323', monospace;
        font-size: 1.2rem;
        color: rgba(255, 255, 255, 0.7);
        margin-top: 10px;
    }
</style>
{% endblock %}

{% block content %}
<div class="blog-container">

    <div class="w-100" data-aos="fade-up" data-aos-duration="1000">
        <img src="{{ url_for('static', filename='assets/iblog/pag_1.png') }}" 
             alt="Conteúdo Parte 1" 
             class="animated-page-img">
    </div>

    <div class="transition-divider" data-aos="zoom-in" data-aos-duration="800">
        <h2 class="transition-title">TOP ÁLBUNS DA SEMANA</h2>
        <p class="transition-subtitle">> as músicas que estão derretendo o nosso player...</p>
    </div>

    <div class="w-100" data-aos="fade-up" data-aos-duration="1200">
        <img src="{{ url_for('static', filename='assets/iblog/pag_2.png') }}" 
             alt="Conteúdo Parte 2" 
             class="animated-page-img">
    </div>

</div>
{% endblock %}
