<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}iDiva's Portal{% endblock %}</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Chewy&family=Modak&family=VT323&family=Pacifico&family=Titan+One&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            /* Fundo corrigido: gradiente roxo com ciano sem bugs */
            background: linear-gradient(180deg, #37add1 0%, #1a0826 60%, #0d0413 100%) !important;
            background-attachment: fixed !important;
            font-family: 'Arial', sans-serif;
            overflow-x: hidden;
            color: #fff;
            cursor: url('https://cur.cursors-4u.net/symbols/sym-1/sym49.cur'), auto !important;
        }

        .main-wrapper {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* --- O SEGREDO DA CENTRALIZAÇÃO --- */
        .page-content {
            width: 95%;
            max-width: 1300px; /* Trava o crescimento lateral */
            margin: 0 auto 50px auto; /* Centraliza na tela e dá espaço embaixo */
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Bloco para CSS extra de outras páginas não poluir o base */
        {% block extra_css %}{% endblock %}
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <div class="main-wrapper">
        {% include 'includes/navbar.html' %}

        <main class="page-content">
            {% block content %}{% endblock %}
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        // Inicializa as animações de rolagem para todas as páginas
        AOS.init({ offset: 100, once: false, mirror: true });
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
