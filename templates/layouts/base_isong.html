<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}iDiva's Portal{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Chewy&family=Modak&family=VT323&family=Pacifico&family=Titan+One&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            background: linear-gradient(
                180deg,
                #37add1 0%,
                #1a0826 60%,
                #0d0413 100%
            ) !important;
            background-attachment: fixed !important;
            font-family: Arial, sans-serif;
            overflow-x: hidden;
            color: #fff;
            cursor: url('https://cur.cursors-4u.net/symbols/sym-1/sym49.cur'), auto !important;
        }

        .main-wrapper {
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /*
        =====================================================
        CONTEÚDO PRINCIPAL
        =====================================================

        Antes:
        - max-width: 1300px
        - align-items: center

        Agora:
        - largura total
        - alinhado à esquerda
        - ocupa o mesmo espaço visual da navbar
        */

        .page-content {
            width: 100%;
            max-width: none;
            margin: 0;
            padding: 0 24px 50px 24px;

            display: flex;
            flex-direction: column;
            align-items: stretch;
        }

        /* CSS específico das páginas */
        {% block extra_css %}{% endblock %}
    </style>

    {% block extra_head %}{% endblock %}
</head>
<body>

    <div class="main-wrapper">

        {% include 'includes/navbar.html' %}

        <main class="page-content">
            {% block content %}{% endblock %}
        </main>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

    <script>
        AOS.init({
            offset: 100,
            once: false,
            mirror: true
        });
    </script>

    {% block extra_js %}{% endblock %}
</body>
</html>
