{% extends 'layouts/base_inews.html' %}

{% block title %}iNews - As Últimas Fofocas{% endblock %}

{% block extra_css %}
<style>
    /* ========================================================= */
    /* --- ESTILOS DA PÁGINA INEWS --- */
    /* ========================================================= */
    
    /* Container principal da área de notícias */
    .inews-master-wrapper {
        /* Fundo roxo repetitivo atualizado para manter a consistência com a Home */
        background-image: url("{{ url_for('static', filename='media/background/background_roxo.png') }}");
        background-repeat: repeat-y;
        background-position: top center;
        background-size: 100% auto;
        
        margin: 50px auto; 
        width: 95%; 
        max-width: 1200px; 
        padding: 40px; 
        border-radius: 30px;
        border: 4px solid #fff;
        box-shadow: 10px 10px 0px rgba(0,0,0,0.2);
    }

    /* Caixa de texto ACIMA da imagem */
    .inews-text-header {
        background-color: #000000; 
        border: 4px solid #333333; 
        border-radius: 10px;
        padding: 20px 30px;
        margin-bottom: 20px;
        text-align: center;
        box-shadow: inset 0 0 15px rgba(0,0,0,1); 
    }

    .inews-title {
        font-family: 'VT323', monospace; 
        color: #ffffff; 
        font-size: 3rem;
        margin-bottom: 5px;
        text-transform: uppercase;
        text-shadow: 0 0 5px rgba(255,255,255,0.5); 
        line-height: 1;
    }

    .inews-desc {
        font-family: 'VT323', monospace;
        color: #ffffff; 
        font-size: 1.5rem;
        line-height: 1.2;
        margin: 0;
        letter-spacing: 1px;
    }

    /* O container que segura a imagem */
    .inews-image-wrapper {
        width: 100%;
        border-radius: 10px;
        border: 4px solid #333;
        overflow: hidden;
        background-color: #000;
        box-shadow: 0px 10px 20px rgba(0,0,0,0.3);
    }

    /* A imagem de 1920x1080 responsiva */
    .inews-img {
        width: 100%;
        height: auto;
        aspect-ratio: 16 / 9; 
        object-fit: cover;
        display: block;
    }

    /* Customizando as setas do carrossel */
    .carousel-control-prev, .carousel-control-next {
        width: 8%; 
    }

    .custom-arrow-btn {
        background-color: #000;
        width: 50px;
        height: 50px;
        border-radius: 5px; 
        border: 3px solid #333;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 3px 3px 0px rgba(0,0,0,0.5);
        transition: transform 0.1s;
    }

    .carousel-control-prev:hover .custom-arrow-btn, 
    .carousel-control-next:hover .custom-arrow-btn {
        transform: scale(1.05);
        border-color: #ffffff; 
    }

    /* ========================================================= */
    /* --- RESPONSIVIDADE --- */
    /* ========================================================= */
    @media (max-width: 900px) {
        .inews-master-wrapper {
            padding: 20px;
            margin: 20px auto;
            border-radius: 15px;
        }
        .inews-title { font-size: 2rem; }
        .inews-desc { font-size: 1.2rem; }
        .custom-arrow-btn { width: 40px; height: 40px; }
    }
</style>
{% endblock %}

{% block content %}

    <div class="inews-master-wrapper" data-aos="fade-up" data-aos-duration="1000">

        <div class="inews-text-header">
            <h2 class="inews-title">INEWS</h2>
            <p class="inews-desc">As fofocas mais quentes e os acontecimentos bombásticos do momento!</p>
        </div>

        <div id="iNewsSlider" class="carousel slide" data-bs-ride="false" data-bs-touch="true">
            
            <div class="carousel-inner">
                
                {% for imagem in imagens_jornal %}
                    <div class="carousel-item {% if loop.index0 == 0 %}active{% endif %}">

                        <div class="inews-image-wrapper">
                            <img src="{{ url_for('static', filename='media/jornal/' ~ imagem) }}" class="inews-img" alt="Notícia {{ loop.index }}">
                        </div>

                    </div>
                {% endfor %}

            </div>

            <button class="carousel-control-prev" type="button" data-bs-target="#iNewsSlider" data-bs-slide="prev">
                <div class="custom-arrow-btn">
                    <span class="carousel-control-prev-icon" aria-hidden="true" style="filter: invert(1);"></span>
                </div>
                <span class="visually-hidden">Anterior</span>
            </button>
            
            <button class="carousel-control-next" type="button" data-bs-target="#iNewsSlider" data-bs-slide="next">
                <div class="custom-arrow-btn">
                    <span class="carousel-control-next-icon" aria-hidden="true" style="filter: invert(1);"></span>
                </div>
                <span class="visually-hidden">Próximo</span>
            </button>

        </div> 
    </div>

{% endblock %}
