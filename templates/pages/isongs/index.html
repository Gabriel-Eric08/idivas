{% extends 'layouts/base.html' %}

{% block title %}iSongs{% endblock %}

{% block extra_css %}
<style>
    /* ========================================================= */
    /* --- LAYOUT GRUDADO COM FUNDO CINZA SÓLIDO (ESTILO APP) --- */
    /* ========================================================= */
    
    /* Container Master: Fundo cinza sólido, eliminando o efeito flutuante */
    .isongs-master-wrapper {
        background-color: #181818; /* Cinza escuro sólido clássico */
        color: #ffffff;
        width: 100%;
        min-height: 100vh;
        padding: 40px;
        box-sizing: border-box;
        text-align: left;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* Título ISONGS no topo esquerdo */
    .isongs-header-box {
        margin-bottom: 40px;
        border-bottom: 1px solid #282828;
        padding-bottom: 20px;
    }

    .isongs-main-title {
        font-size: 3rem;
        font-weight: 900;
        letter-spacing: -1px;
        margin: 0;
        color: #fff;
    }
    .isongs-master-wrapper {
    background-color: #181818;
    color: #ffffff;

    width: 100%;
    max-width: 1300px;

    margin: 0 auto;

    min-height: 100vh;
    padding: 40px;

    box-sizing: border-box;
    text-align: left;

    font-family: -apple-system, BlinkMacSystemFont,
                 "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}   
    .isongs-master-wrapper {
    width: 100%;
    max-width: 1270px; /* ajuste fino */
    margin: 0 auto;
    background: #181818;
    padding: 40px;
}
    /* Cabeçalhos de Seção */
    .isongs-section-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        margin-bottom: 16px;
        margin-top: 30px;
    }

    .isongs-section-title {
        font-size: 1.5rem;
        font-weight: 700;
        letter-spacing: -0.5px;
        margin: 0;
        color: #ffffff;
    }

    .isongs-show-all {
        color: #b3b3b3;
        font-size: 0.85rem;
        font-weight: 700;
        text-decoration: none;
    }
    .isongs-show-all:hover {
        text-decoration: underline;
    }

    /* Linhas horizontais de Scroll */
    .isongs-row {
        display: flex;
        gap: 24px;
        overflow-x: auto;
        padding-bottom: 20px;
        width: 100%;
    }

    /* Ocultar barra de rolagem para parecer um app nativo */
    .isongs-row::-webkit-scrollbar {
        display: none;
    }
    .isongs-row {
        -ms-overflow-style: none;
        scrollbar-width: none;
    }
    .isongs-section {
    width: 100%;
    background: #222222;
    border-radius: 12px;
    padding: 24px;
    margin-bottom: 32px;
}

    /* --- ARTISTAS POPULARES (CÍRCULOS) --- */
    .artist-card {
        flex: 0 0 auto;
        width: 160px;
        text-align: left;
        cursor: pointer;
    }

    .artist-circle {
        width: 160px;
        height: 160px;
        border-radius: 50%;
        object-fit: cover;
        margin-bottom: 12px;
        box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        transition: transform 0.2s ease;
    }

    .artist-card:hover .artist-circle {
        transform: scale(1.04);
    }

    .artist-name {
        font-size: 1rem;
        font-weight: 700;
        color: #ffffff;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        margin-bottom: 4px;
    }

    .artist-badge {
        color: #b3b3b3;
        font-size: 0.85rem;
    }

    /* --- SINGLES E ÁLBUNS (QUADRADOS) --- */
    .album-card {
        flex: 0 0 auto;
        width: 160px;
        text-align: left;
        cursor: pointer;
        padding: 12px;
        background: transparent;
        border-radius: 8px;
        transition: background-color 0.3s ease;
    }

    .album-card:hover {
        background-color: rgba(255,255,255,0.08);
    }

    .album-square {
        width: 136px;
        height: 136px;
        border-radius: 6px;
        object-fit: cover;
        margin-bottom: 12px;
        box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }

    .album-title {
        font-size: 1rem;
        font-weight: 700;
        color: #ffffff;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        margin-bottom: 4px;
    }

    .album-artist {
        color: #b3b3b3;
        font-size: 0.85rem;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    /* --- SEÇÃO DE MÚSICAS EXPANDIDA --- */
    .tracks-expansion-panel {
    width: 100%;
    display: none;
    background: #222222;
    border-radius: 12px;
    padding: 30px;
    margin-top: 40px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.6);
}

    .panel-content {
        display: flex;
        gap: 32px;
        align-items: flex-start;
    }

    .panel-cover-side {
        flex: 0 0 auto;
        width: 220px;
    }

    .panel-album-cover {
        width: 220px;
        height: 220px;
        border-radius: 8px;
        box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        object-fit: cover;
    }

    .panel-album-title {
        font-size: 1.8rem;
        font-weight: 700;
        margin-top: 16px;
        margin-bottom: 4px;
    }

    .panel-list-side {
        flex: 1;
        width: 100%;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(15px); }
        to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 768px) {
        .panel-content { flex-direction: column; }
        .isongs-master-wrapper { padding: 20px; }
        .panel-cover-side { width: 100%; text-align: center; }
        .panel-album-cover { width: 200px; height: 200px; }
    }

    .isongs-section {
        background: #222222;
        border-radius: 12px;
        padding: 24px;
        margin-bottom: 32px;
    }

    .isongs-row {
        background: #222222;
        border-radius: 12px;
        padding: 16px 0 0 0;
    }
</style>
{% endblock %}

{% block content %}
    <div class="isongs-master-wrapper">
        
        <div class="isongs-header-box">
            <h1 class="isongs-main-title">ISONGS</h1>
        </div>

        <div class="isongs-section">
            <div class="isongs-section-header" style="margin-top: 0;">
                <h2 class="isongs-section-title">Artistas populares</h2>
                <a href="#" class="isongs-show-all">Mostrar tudo</a>
            </div>
            <div class="isongs-row" id="artists-container"></div>
        </div>

        <div class="isongs-section">
            <div class="isongs-section-header">
                <h2 class="isongs-section-title" id="albums-section-title">Escolha uma artista para ver os álbuns</h2>
                <a href="#" class="isongs-show-all">Mostrar tudo</a>
            </div>
            <div class="isongs-row" id="albums-container"></div>
        </div>

        <div class="isongs-section" style="background: transparent; padding: 0;">
            <div class="tracks-expansion-panel" id="tracks-panel">
                <div class="panel-content" id="panel-content-target"></div>
            </div>
        </div>
    </div>

    <script>
    // Banco de Dados Dinâmico estruturado para carregar por artista
    const iSongsData = {
        artists: [
            { id: "beyonce", name: "Beyoncé", image: "{{ url_for('static', filename='media/perfil/beyonce.png') }}" }, // Caminho da sua pasta ou url web
            { id: "rihanna", name: "Rihanna", image: "{{ url_for('static', filename='media/perfil/rihanna.png') }}" }, // Usei placeholder, se tiver local troque pela tag url_for
            { id: "ladygaga", name: "Lady Gaga", image: "{{ url_for('static', filename='media/perfil/ladygaga.png') }}" }
        ],
        albums: {
            beyonce: [
                {
                    id: "dangerously_in_love",
                    title: "Dangerously in Love",
                    artist: "Beyoncé",
                    image: "{{ url_for('static', filename='media/jornal/dgil.png') }}",
                    // ABAIXO VOCÊ COLA APENAS O LINK DO SRC DO IFRAME DO SPOTIFY EMBED (lembrando de usar o formato /embed/)
                    spotifyUrl: "https://open.spotify.com/embed/album/06v9eHnqhMK2tbM2Iz3p0Y?utm_source=generator"
                },
                {
                    id: "bday",
                    title: "B'Day",
                    artist: "Beyoncé",
                    image: "{{ url_for('static', filename='media/jornal/bday.png') }}",
                    spotifyUrl: "https://open.spotify.com/embed/album/77eZ5eMEh3U0KWricrbevO?utm_source=generator" // Cole aqui o link correspondente
                }
            ],
            rihanna: [
                {
                    id: "anti",
                    title: "ANTI",
                    artist: "Rihanna",
                    image: "{{ url_for('static', filename='media/jornal/anti.png') }}",
                    spotifyUrl: "https://open.spotify.com/embed/album/48i37aZTC1prDr4EcpQeEa?utm_source=generator" // Cole aqui o link correspondente
                },
                {
                    id: "music_of_the_sun",
                    title: "Music of The Sun",
                    artist: "Rihanna",
                    image: "{{ url_for('static', filename='media/jornal/mots.png') }}",
                    spotifyUrl: "https://open.spotify.com/embed/album/4FyGpObwABjn0o8Tdp7AZz?utm_source=generator" // Cole aqui o link correspondente
                }
            ],
            ladygaga: [
                {
                    id: "born_this_way",
                    title: "Born This Way",
                    artist: "Lady Gaga",
                    image: "{{ url_for('static', filename='media/jornal/btw.png') }}",
                    spotifyUrl: "https://open.spotify.com/embed/album/6LY3AerY6KNGOPsNPL63Kk?utm_source=generator" // Cole aqui o link correspondente
                },
                {
                    id: "the_fame",
                    title: "The Fame",
                    artist: "Lady Gaga",
                    image: "{{ url_for('static', filename='media/jornal/tfame.png') }}",
                    spotifyUrl: "https://open.spotify.com/embed/album/1qwlxZTNLe1jq3b0iidlue?utm_source=generator" // Cole aqui o link correspondente
                }
            ]
        }
    };

    // 1. Renderiza as 3 artistas principais
    function renderArtists() {
        const container = document.getElementById('artists-container');
        container.innerHTML = iSongsData.artists.map(artist => `
            <div class="artist-card" onclick="selectArtist('${artist.id}', '${artist.name}')">
                <img src="${artist.image}" class="artist-circle" alt="${artist.name}" onerror="this.src='https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=300'">
                <div class="artist-name">${artist.name}</div>
                <div class="artist-badge">Artista</div>
            </div>
        `).join('');
    }

    // 2. Evento ao clicar na artista: Mostra seus respectivos álbuns
    function selectArtist(artistId, artistName) {
        const titleContainer = document.getElementById('albums-section-title');
        const albumsContainer = document.getElementById('albums-container');
        const panel = document.getElementById('tracks-panel');
        
        // Esconde o painel de players antigo ao mudar de artista
        panel.style.display = 'none';

        titleContainer.innerText = `Álbuns de ${artistName}`;
        
        const artistAlbums = iSongsData.albums[artistId] || [];

        if (artistAlbums.length === 0) {
            albumsContainer.innerHTML = `<p style="padding-left: 16px; color: #b3b3b3;">Nenhum álbum cadastrado.</p>`;
            return;
        }

        albumsContainer.innerHTML = artistAlbums.map(album => `
            <div class="album-card" onclick="expandSpotifyPlayer('${artistId}', '${album.id}')">
                <img src="${album.image}" class="album-square" alt="${album.title}" onerror="this.src='https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=300'">
                <div class="album-title">${album.title}</div>
                <div class="album-artist">${album.artist}</div>
            </div>
        `).join('');
    }

    // 3. Evento ao clicar no álbum: Expande o player do Spotify correspondente
    function expandSpotifyPlayer(artistId, albumId) {
        const panel = document.getElementById('tracks-panel');
        const target = document.getElementById('panel-content-target');
        
        const artistAlbums = iSongsData.albums[artistId];
        const album = artistAlbums ? artistAlbums.find(a => a.id === albumId) : null;
        
        if (!album) return;

        // Se o link do spotify estiver vazio no objeto, mostraremos uma mensagem amigável temporária
        const iframeContent = album.spotifyUrl ? `
            <iframe style="border-radius:12px;" 
                src="${album.spotifyUrl}" 
                width="100%" 
                height="352" 
                frameBorder="0" 
                allowfullscreen="" 
                allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" 
                loading="lazy">
            </iframe>
        ` : `
            <div style="background: #333; padding: 40px; border-radius: 12px; text-align: center; color: #b3b3b3;">
                <p style="margin: 0; font-size: 1.1rem; font-weight: bold;">Player indisponível</p>
                <p style="margin: 5px 0 0 0; font-size: 0.9rem;">Insira o link do Spotify para este álbum no JavaScript.</p>
            </div>
        `;

        target.innerHTML = `
            <div class="panel-cover-side">
                <img src="${album.image}" class="panel-album-cover" alt="${album.title}" onerror="this.src='https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=300'">
                <h3 class="panel-album-title">${album.title}</h3>
                <p style="color: #b3b3b3; margin:0; font-size:0.9rem;">${album.artist}</p>
            </div>
            <div class="panel-list-side">
                ${iframeContent}
            </div>
        `;

        panel.style.display = 'block';
        panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    // Inicialização da página
    window.onload = () => {
        renderArtists();
    };
    </script>
{% endblock %}
